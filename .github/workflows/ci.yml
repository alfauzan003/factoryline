name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore FactoryLine.sln
      - name: Build
        run: dotnet build FactoryLine.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FactoryLine.sln --configuration Release --no-build
